<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>دعوة زفاف</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           شاشة البداية
        ===================================================== */

        #coverScreen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100dvh;

            background: #000;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;

            transition:
                opacity 0.8s ease,
                visibility 0.8s ease;
        }


        #coverImage {
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }


        #coverScreen.hide {
            opacity: 0;
            visibility: hidden;
        }


        /* =====================================================
           صفحة الدعوة
        ===================================================== */

        #invitationPage {
            display: none;

            width: 100%;

            background: #000;

            position: relative;
        }


        /* =====================================================
           حاوية الدعوة
        ===================================================== */

        #invitationContainer {
            position: relative;

            width: 100%;

            margin: 0 auto;

            line-height: 0;
        }


        /* =====================================================
           صورة الدعوة الطويلة
        ===================================================== */

        #invitationImage {
            display: block;

            width: 100%;
            height: auto;

            max-width: 100%;

            margin: 0 auto;

            user-select: none;
            -webkit-user-select: none;

            -webkit-touch-callout: none;

            pointer-events: none;
        }


        /* =====================================================
           زر الموسيقى
           
           مربوط بالصورة وليس بالشاشة
           
           مركزه فوق مركز القرص
        ===================================================== */

        #musicButton {

            position: absolute;

            left: 31.7%;
            top: 11.5%;

            transform: translate(-50%, -50%);

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.9);

            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(255,255,255,0.90),
                    rgba(255,255,255,0.40) 35%,
                    rgba(75,65,60,0.48) 100%
                );

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 50;

            cursor: pointer;

            padding: 0;

            line-height: 1;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.38),
                inset 0 1px 4px rgba(255,255,255,0.72),
                inset 0 -3px 7px rgba(0,0,0,0.15);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            -webkit-tap-highlight-color: transparent;
        }


        /* الحلقة الداخلية */

        #musicButton::before {

            content: "";

            position: absolute;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.38);

            pointer-events: none;
        }


        /* أيقونة الموسيقى */

        #musicIcon {

            position: relative;

            z-index: 2;

            color: #fff;

            font-size: 23px;

            font-family: Arial, sans-serif;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.6);

            line-height: 1;
        }


        /* تأثير أثناء تشغيل الموسيقى */

        #musicButton.playing {

            animation:
                musicGlow 2s infinite;
        }


        @keyframes musicGlow {

            0% {

                box-shadow:
                    0 3px 12px rgba(0,0,0,0.38),
                    0 0 0 0 rgba(255,255,255,0.35);
            }

            50% {

                box-shadow:
                    0 3px 12px rgba(0,0,0,0.38),
                    0 0 0 7px rgba(255,255,255,0);
            }

            100% {

                box-shadow:
                    0 3px 12px rgba(0,0,0,0.38),
                    0 0 0 0 rgba(255,255,255,0);
            }
        }


        #musicButton:active {

            transform:
                translate(-50%, -50%)
                scale(0.92);
        }


        /* =====================================================
           قسم العداد
           
           موجود داخل صورة الدعوة
           وليس ثابتًا على الشاشة
        ===================================================== */

        #countdownSection {

            position: absolute;

            left: 50%;

            bottom: 4.2%;

            transform: translateX(-50%);

            width: 94%;

            z-index: 40;

            text-align: center;

            line-height: normal;
        }


        /* =====================================================
           عنوان العداد
        ===================================================== */

        #countdownTitle {

            display: inline-block;

            position: relative;

            margin-bottom: 15px;

            padding: 0 28px;

            color: #5a3d20;

            font-size:
                clamp(23px, 6vw, 34px);

            font-weight: 500;

            letter-spacing: 0.3px;

            text-shadow:
                0 1px 1px rgba(255,255,255,0.8);
        }


        /* زخارف العنوان */

        #countdownTitle::before,
        #countdownTitle::after {

            content: "✦";

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            color: #a77a3c;

            font-size: 12px;
        }


        #countdownTitle::before {
            right: 4px;
        }


        #countdownTitle::after {
            left: 4px;
        }


        /* =====================================================
           العدادات
        ===================================================== */

        #countdown {

            display: flex;

            justify-content: center;
            align-items: center;

            gap:
                clamp(6px, 2vw, 12px);

            direction: rtl;
        }


        /* =====================================================
           دوائر العداد
        ===================================================== */

        .timeBox {

            position: relative;

            width:
                clamp(70px, 19vw, 94px);

            height:
                clamp(82px, 22vw, 105px);

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,250,239,0.97) 0%,
                    rgba(245,231,207,0.93) 65%,
                    rgba(226,202,165,0.90) 100%
                );

            border:
                1px solid rgba(157,115,59,0.7);

            box-shadow:

                0 5px 18px
                rgba(65,43,21,0.22),

                inset 0 0 0 4px
                rgba(255,255,255,0.32),

                inset 0 0 0 5px
                rgba(174,132,75,0.15);

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            line-height: normal;
        }


        /* الحلقة الداخلية */

        .timeBox::before {

            content: "";

            position: absolute;

            inset: 7px;

            border-radius: 50%;

            border:
                1px solid
                rgba(169,128,70,0.32);

            pointer-events: none;
        }


        /* الرقم */

        .number {

            position: relative;

            z-index: 2;

            display: block;

            color: #55391d;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(25px, 7vw, 36px);

            font-weight: 500;

            line-height: 1;

            font-variant-numeric:
                tabular-nums;
        }


        /* اسم الوحدة */

        .label {

            position: relative;

            z-index: 2;

            display: block;

            margin-top: 7px;

            color: #8a6740;

            font-size:
                clamp(9px, 2.5vw, 13px);

            font-weight: 500;

            line-height: 1;

            white-space: nowrap;
        }


        /* =====================================================
           الهواتف
        ===================================================== */

        @media (max-width: 480px) {

            #musicButton {

                width: 52px;
                height: 52px;
            }


            #musicButton::before {

                width: 40px;
                height: 40px;
            }


            #musicIcon {

                font-size: 23px;
            }


            #countdownSection {

                bottom: 4%;

                width: 96%;
            }


            #countdownTitle {

                font-size: 23px;

                margin-bottom: 11px;
            }


            .timeBox {

                width: 21.5vw;
                height: 21.5vw;

                min-width: 62px;
                min-height: 62px;

                max-width: 84px;
                max-height: 84px;
            }


            .timeBox::before {

                inset: 5px;
            }


            .number {

                font-size: 22px;
            }


            .label {

                margin-top: 5px;

                font-size: 8px;
            }
        }


        /* =====================================================
           شاشات صغيرة جدًا
        ===================================================== */

        @media (max-width: 360px) {

            #musicButton {

                width: 48px;
                height: 48px;
            }


            #musicButton::before {

                width: 37px;
                height: 37px;
            }


            #musicIcon {

                font-size: 20px;
            }


            #countdownTitle {

                font-size: 20px;
            }


            #countdown {

                gap: 3px;
            }


            .timeBox {

                min-width: 57px;
                min-height: 57px;
            }


            .number {

                font-size: 19px;
            }


            .label {

                font-size: 7px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         شاشة البداية
    ===================================================== -->

    <div id="coverScreen">

        <img
            id="coverImage"
            src="cover.jpg"
            alt="فتح الدعوة"
        >

    </div>



    <!-- =====================================================
         الدعوة الداخلية
    ===================================================== -->

    <main id="invitationPage">

        <div id="invitationContainer">


            <!-- الصورة الطويلة -->

            <img
                id="invitationImage"
                src="invitation.jpg"
                alt="دعوة الزفاف"
            >



            <!-- =================================================
                 زر الموسيقى
                 
                 فوق مركز القرص
            ================================================== -->

            <button
                id="musicButton"
                type="button"
                aria-label="تشغيل الموسيقى"
            >

                <span id="musicIcon">
                    ♫
                </span>

            </button>



            <!-- =================================================
                 العداد
            ================================================== -->

            <section id="countdownSection">


                <div id="countdownTitle">
                      المتبقي للخطبة
                </div>


                <div id="countdown">


                    <!-- الأيام -->

                    <div class="timeBox">

                        <span
                            class="number"
                            id="days">

                            00

                        </span>

                        <span class="label">
                            يوم
                        </span>

                    </div>



                    <!-- الساعات -->

                    <div class="timeBox">

                        <span
                            class="number"
                            id="hours">

                            00

                        </span>

                        <span class="label">
                            ساعة
                        </span>

                    </div>



                    <!-- الدقائق -->

                    <div class="timeBox">

                        <span
                            class="number"
                            id="minutes">

                            00

                        </span>

                        <span class="label">
                            دقيقة
                        </span>

                    </div>



                    <!-- الثواني -->

                    <div class="timeBox">

                        <span
                            class="number"
                            id="seconds">

                            00

                        </span>

                        <span class="label">
                            ثانية
                        </span>

                    </div>


                </div>

            </section>


        </div>

    </main>



    <!-- =====================================================
         الموسيقى
    ===================================================== -->

    <audio
        id="weddingMusic"
        src="music.mp3"
        preload="auto"
        loop>
    </audio>



    <script>


        /* =====================================================
           العناصر
        ===================================================== */

        const coverScreen =
            document.getElementById(
                "coverScreen"
            );


        const invitationPage =
            document.getElementById(
                "invitationPage"
            );


        const weddingMusic =
            document.getElementById(
                "weddingMusic"
            );


        const musicButton =
            document.getElementById(
                "musicButton"
            );


        const musicIcon =
            document.getElementById(
                "musicIcon"
            );


        let invitationOpened = false;



        /* =====================================================
           فتح الدعوة
        ===================================================== */

        function openInvitation() {

            if (invitationOpened) {
                return;
            }


            invitationOpened = true;


            /*
             * إظهار الدعوة
             */

            invitationPage.style.display =
                "block";


            /*
             * تشغيل الموسيقى مباشرة
             * بعد نقرة المستخدم
             */

            weddingMusic.volume = 1;


            weddingMusic
                .play()
                .then(() => {

                    musicButton
                        .classList
                        .add("playing");

                    musicIcon.textContent =
                        "♫";

                })
                .catch(() => {

                    musicIcon.textContent =
                        "♫";

                });


            /*
             * إخفاء صورة البداية
             */

            coverScreen
                .classList
                .add("hide");


            /*
             * إزالة شاشة البداية
             * بعد انتهاء الحركة
             */

            setTimeout(() => {

                coverScreen.style.display =
                    "none";

            }, 850);

        }



        /* =====================================================
           النقر على صورة البداية
        ===================================================== */

        coverScreen.addEventListener(
            "click",
            openInvitation
        );


        coverScreen.addEventListener(
            "touchend",
            openInvitation,
            {
                passive: true
            }
        );



        /* =====================================================
           زر الموسيقى
        ===================================================== */

        musicButton.addEventListener(
            "click",
            function(event) {

                /*
                 * منع النقر من التأثير
                 * على بقية الصفحة
                 */

                event.stopPropagation();


                /*
                 * تشغيل الموسيقى
                 */

                if (weddingMusic.paused) {

                    weddingMusic
                        .play()
                        .then(() => {

                            musicButton
                                .classList
                                .add("playing");

                            musicIcon.textContent =
                                "♫";

                        })
                        .catch(() => {});

                }


                /*
                 * إيقاف الموسيقى
                 */

                else {

                    weddingMusic.pause();


                    musicButton
                        .classList
                        .remove("playing");


                    musicIcon.textContent =
                        "♪";

                }

            }
        );



        /* =====================================================
           العداد التنازلي
           
           التاريخ:
           15 نوفمبر 2026
           
           الساعة:
           17:00
        ===================================================== */

        const weddingDate =
            new Date(
                "2026-11-15T17:00:00+01:00"
            ).getTime();



        const daysElement =
            document.getElementById(
                "days"
            );


        const hoursElement =
            document.getElementById(
                "hours"
            );


        const minutesElement =
            document.getElementById(
                "minutes"
            );


        const secondsElement =
            document.getElementById(
                "seconds"
            );



        /* =====================================================
           تحديث العداد
        ===================================================== */

        function updateCountdown() {

            const now =
                new Date().getTime();


            const difference =
                weddingDate - now;


            /*
             * انتهى الوقت
             */

            if (difference <= 0) {

                daysElement.textContent =
                    "00";

                hoursElement.textContent =
                    "00";

                minutesElement.textContent =
                    "00";

                secondsElement.textContent =
                    "00";

                return;
            }


            /*
             * الأيام
             */

            const days =
                Math.floor(
                    difference /
                    (1000 * 60 * 60 * 24)
                );


            /*
             * الساعات
             */

            const hours =
                Math.floor(
                    (
                        difference %
                        (1000 * 60 * 60 * 24)
                    ) /
                    (1000 * 60 * 60)
                );


            /*
             * الدقائق
             */

            const minutes =
                Math.floor(
                    (
                        difference %
                        (1000 * 60 * 60)
                    ) /
                    (1000 * 60)
                );


            /*
             * الثواني
             */

            const seconds =
                Math.floor(
                    (
                        difference %
                        (1000 * 60)
                    ) /
                    1000
                );


            /*
             * عرض القيم
             */

            daysElement.textContent =
                String(days)
                .padStart(2, "0");


            hoursElement.textContent =
                String(hours)
                .padStart(2, "0");


            minutesElement.textContent =
                String(minutes)
                .padStart(2, "0");


            secondsElement.textContent =
                String(seconds)
                .padStart(2, "0");

        }



        /* =====================================================
           تشغيل العداد
        ===================================================== */

        updateCountdown();


        setInterval(
            updateCountdown,
            1000
        );


    </script>

</body>

</html>
